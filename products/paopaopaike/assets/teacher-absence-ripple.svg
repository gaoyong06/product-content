<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">临时请假造成的排课连锁变化</title>
  <desc id="desc">一处变化通过课表关系影响教师、班级和场地</desc>
  <rect width="1200" height="675" fill="#F7F8FA"/>
  <text x="85" y="105" fill="#16324F" font-size="38" font-family="PingFang SC, sans-serif">只调一节课？</text>
  <text x="88" y="148" fill="#667085" font-size="24" font-family="PingFang SC, sans-serif">一次临时变化，可能牵动整张课表</text>
  <g fill="none" stroke="#D7DEE8" stroke-width="4"><circle cx="600" cy="350" r="82"/><circle cx="600" cy="350" r="165"/><circle cx="600" cy="350" r="250"/></g>
  <circle cx="600" cy="350" r="64" fill="#E68A4A"/><text x="600" y="342" text-anchor="middle" fill="#FFFFFF" font-size="26" font-family="PingFang SC, sans-serif">临时</text><text x="600" y="375" text-anchor="middle" fill="#FFFFFF" font-size="26" font-family="PingFang SC, sans-serif">请假</text>
  <g font-family="PingFang SC, sans-serif" text-anchor="middle"><rect x="140" y="280" width="180" height="78" rx="14" fill="#E7F3F2"/><text x="230" y="328" fill="#16324F" font-size="26">教师课表</text><rect x="880" y="280" width="180" height="78" rx="14" fill="#E7F3F2"/><text x="970" y="328" fill="#16324F" font-size="26">班级课表</text><rect x="500" y="105" width="200" height="78" rx="14" fill="#E7F3F2"/><text x="600" y="153" fill="#16324F" font-size="26">教学场地</text><rect x="500" y="520" width="200" height="78" rx="14" fill="#FFF0E5"/><text x="600" y="568" fill="#8A451D" font-size="26">替代方案</text></g>
  <path d="M520 350H320M680 350h200M600 286V183M600 414v106" stroke="#69A7B4" stroke-width="5"/>
  <text x="600" y="645" text-anchor="middle" fill="#667085" font-size="22" font-family="PingFang SC, sans-serif">先发现冲突，再决定怎么调</text>
</svg>
