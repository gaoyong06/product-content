<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">排课规则关系图</title>
  <desc id="desc">教师、班级、场地和时间组成的排课关系</desc>
  <rect width="1200" height="675" fill="#F6F8FB"/>
  <text x="90" y="105" fill="#16324F" font-size="38" font-family="PingFang SC, sans-serif">排课不是填表，是处理关系</text>
  <text x="92" y="145" fill="#667085" font-size="22" font-family="PingFang SC, sans-serif">每一条要求，都可能影响另一张表</text>
  <g stroke="#8BB9C7" stroke-width="5" fill="none"><path d="M275 300L540 225"/><path d="M275 300L540 430"/><path d="M925 300L660 225"/><path d="M925 300L660 430"/><path d="M540 225L660 225"/><path d="M540 430L660 430"/></g>
  <g font-family="PingFang SC, sans-serif" text-anchor="middle"><circle cx="220" cy="300" r="92" fill="#16324F"/><text x="220" y="292" fill="#FFFFFF" font-size="28">教师</text><text x="220" y="328" fill="#CFE8ED" font-size="19">不可用时间</text><circle cx="980" cy="300" r="92" fill="#16324F"/><text x="980" y="292" fill="#FFFFFF" font-size="28">班级</text><text x="980" y="328" fill="#CFE8ED" font-size="19">课时分布</text><rect x="480" y="165" width="240" height="120" rx="16" fill="#E7F3F2" stroke="#69A7B4" stroke-width="3"/><text x="600" y="220" fill="#16324F" font-size="28">时间</text><text x="600" y="255" fill="#397985" font-size="19">节次 / 连堂</text><rect x="480" y="370" width="240" height="120" rx="16" fill="#FFF0E5" stroke="#E68A4A" stroke-width="3"/><text x="600" y="425" fill="#8A451D" font-size="28">场地</text><text x="600" y="460" fill="#A75C2B" font-size="19">容量 / 冲突</text></g>
  <text x="600" y="590" text-anchor="middle" fill="#667085" font-size="24" font-family="PingFang SC, sans-serif">先把规则说清楚，再让系统计算可行方案</text>
</svg>
