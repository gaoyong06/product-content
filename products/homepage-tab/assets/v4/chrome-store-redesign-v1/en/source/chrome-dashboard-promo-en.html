<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>HomepageTab Chrome Web Store dashboard screenshot</title>
    <style>
      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 1280px;
        height: 800px;
        margin: 0;
        overflow: hidden;
      }

      body {
        color: #ffffff;
        font-family: Arial, Helvetica, sans-serif;
      }

      .dashboard {
        position: relative;
        width: 1280px;
        height: 800px;
        overflow: hidden;
      }

      .product-screen {
        display: block;
        width: 1280px;
        height: 800px;
      }

      .message {
        position: absolute;
        bottom: 40px;
        left: 164px;
      }

      h1 {
        margin: 0;
        font-size: 42px;
        font-weight: 700;
        line-height: 1.08;
        text-shadow: 0 2px 12px rgba(27, 58, 78, 0.5);
      }

      p {
        margin: 10px 0 0;
        font-size: 18px;
        font-weight: 400;
        line-height: 1.35;
        text-shadow: 0 2px 10px rgba(27, 58, 78, 0.5);
      }
    </style>
  </head>
  <body>
    <main class="dashboard" aria-label="HomepageTab dashboard with common sites, tasks, subscriptions, widgets, and calendar">
      <img class="product-screen" src="chrome-screenshot-1-dashboard-base.png" alt="HomepageTab dashboard with sites, tasks, subscriptions, widgets, and calendar">
      <section class="message" aria-label="Product features">
        <h1>HomepageTab</h1>
        <p>Sites, tasks, widgets, and more.</p>
      </section>
    </main>
  </body>
</html>
