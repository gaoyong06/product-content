<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630"><defs><filter id="s"><feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#18324a" flood-opacity=".12"/></filter></defs><rect width="1200" height="630" fill="#f4f8f6"/><text x="78" y="92" font-family="Arial,'PingFang SC',sans-serif" font-size="42" font-weight="700" fill="#17324d">从会出题，到拥有自己的试卷库</text><text x="80" y="132" font-family="Arial,'PingFang SC',sans-serif" font-size="20" fill="#6b7c8f">只差一次系统整理，而不是再做一套新题</text><g filter="url(#s)"><rect x="95" y="205" width="220" height="250" rx="16" fill="#fff"/><rect x="345" y="205" width="220" height="250" rx="16" fill="#fff"/><rect x="595" y="205" width="220" height="250" rx="16" fill="#fff"/><rect x="845" y="205" width="220" height="250" rx="16" fill="#17324d"/></g><g font-family="Arial,'PingFang SC',sans-serif"><text x="145" y="255" font-size="20" font-weight="700" fill="#17324d">01 收集</text><text x="145" y="300" font-size="17" fill="#6b7c8f">找出最满意的</text><text x="145" y="330" font-size="17" fill="#6b7c8f">一套命题成果</text><path d="M145 380h120" stroke="#f2a65a" stroke-width="12" stroke-linecap="round"/><text x="395" y="255" font-size="20" font-weight="700" fill="#17324d">02 标注</text><text x="395" y="300" font-size="17" fill="#6b7c8f">写清年级、章节</text><text x="395" y="330" font-size="17" fill="#6b7c8f">难度和使用场景</text><path d="M395 380h120" stroke="#83c3b5" stroke-width="12" stroke-linecap="round"/><text x="645" y="255" font-size="20" font-weight="700" fill="#17324d">03 校验</text><text x="645" y="300" font-size="17" fill="#6b7c8f">检查答案、版权</text><text x="645" y="330" font-size="17" fill="#6b7c8f">和隐私边界</text><path d="M645 380h120" stroke="#b19bd1" stroke-width="12" stroke-linecap="round"/><text x="895" y="255" font-size="20" font-weight="700" fill="#fff">04 管理</text><text x="895" y="300" font-size="17" fill="#dce7f0">形成自己的</text><text x="895" y="330" font-size="17" fill="#dce7f0">试卷合集</text><path d="M895 380h120" stroke="#f2a65a" stroke-width="12" stroke-linecap="round"/></g><path d="M315 330h30M565 330h30M815 330h30" stroke="#547088" stroke-width="5" stroke-linecap="round"/></svg>
