<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630"><defs><filter id="s"><feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#102b43" flood-opacity=".16"/></filter></defs><rect width="1200" height="630" fill="#f7f4fb"/><text x="78" y="92" font-family="Arial,'PingFang SC',sans-serif" font-size="42" font-weight="700" fill="#17324d">职业倦怠期，别再从零开始一份副业</text><text x="80" y="132" font-family="Arial,'PingFang SC',sans-serif" font-size="20" fill="#6b7c8f">先复用已经做过的专业工作，再决定下一步</text><rect x="90" y="190" width="300" height="330" rx="16" fill="#fff" filter="url(#s)"/><text x="130" y="240" font-family="Arial,'PingFang SC',sans-serif" font-size="22" font-weight="700" fill="#17324d">每天已有的积累</text><g fill="#d9cef0"><rect x="130" y="280" width="220" height="45" rx="9"/><rect x="150" y="345" width="200" height="45" rx="9"/><rect x="120" y="410" width="230" height="45" rx="9"/></g><text x="158" y="309" font-family="Arial,'PingFang SC',sans-serif" font-size="17" fill="#65559b">备课与命题</text><text x="178" y="374" font-family="Arial,'PingFang SC',sans-serif" font-size="17" fill="#65559b">课堂反馈</text><text x="148" y="439" font-family="Arial,'PingFang SC',sans-serif" font-size="17" fill="#65559b">修改后的试卷</text><path d="M455 355h100" stroke="#e28b3f" stroke-width="8" stroke-linecap="round"/><path d="m540 325 35 30-35 30" fill="none" stroke="#e28b3f" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><rect x="650" y="190" width="450" height="330" rx="16" fill="#17324d" filter="url(#s)"/><text x="700" y="240" font-family="Arial,'PingFang SC',sans-serif" font-size="22" font-weight="700" fill="#fff">低成本的第一步</text><circle cx="730" cy="305" r="10" fill="#f2a65a"/><text x="760" y="312" font-family="Arial,'PingFang SC',sans-serif" font-size="18" fill="#fff">挑一套最满意的试卷</text><circle cx="730" cy="365" r="10" fill="#83c3b5"/><text x="760" y="372" font-family="Arial,'PingFang SC',sans-serif" font-size="18" fill="#fff">补齐说明与答案</text><circle cx="730" cy="425" r="10" fill="#d9c8f0"/><text x="760" y="432" font-family="Arial,'PingFang SC',sans-serif" font-size="18" fill="#fff">放进可管理的合集</text></svg>
